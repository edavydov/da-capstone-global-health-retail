name: Generate Synthetic Data

on:
  push:
    branches:
      - add/data-generation
    paths:
      - 'data/generate_synthetic_data.py'
      - 'notebooks/generate_and_join_data.ipynb'
      - 'data/requirements.txt'
      - '.github/workflows/generate-data.yml'
  workflow_dispatch:

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: add/data-generation

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data/requirements.txt
          pip install jupyter nbconvert

      - name: Create output directory
        run: mkdir -p data/output

      - name: Run data generation script
        run: |
          python data/generate_synthetic_data.py \
            --n_customers 500 \
            --n_products 200 \
            --n_stores 20 \
            --n_transactions 5000 \
            --start_signup 2018-01-01 \
            --end_signup 2023-12-31 \
            --start_date 2023-01-01 \
            --end_date 2023-12-31 \
            --out_dir data/output \
            --seed 42

      - name: Execute Jupyter notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --output=generate_and_join_data.ipynb \
            notebooks/generate_and_join_data.ipynb

      - name: Commit generated CSV files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/output/*.csv
          git add notebooks/generate_and_join_data.ipynb
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generate synthetic data and unified dataset" && git push)

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-data
          path: data/output/
          retention-days: 30
