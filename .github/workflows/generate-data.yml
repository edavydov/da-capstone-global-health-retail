name: Generate Synthetic Data

concurrency:
  group: generate-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'data/generate_synthetic_data.py'
      - 'data/requirements.txt'
      - '.github/workflows/generate-data.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data/requirements.txt

      - name: Generate synthetic data
        run: |
          python data/generate_synthetic_data.py \
            --n_customers 500 \
            --n_products 200 \
            --n_stores 20 \
            --n_transactions 5000 \
            --start_date 2023-01-01 \
            --end_date 2023-12-31 \
            --out_dir data

      - name: Verify generated files
        run: |
          echo "Generated CSV files:"
          ls -lh data/*.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-data
          path: data/*.csv
          retention-days: 30

      - name: Commit and push generated files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated synthetic data files"
            # Ensure we have the latest main and rebase local commit(s) on top to avoid non-fast-forward errors
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch --recurse-submodules=false origin main
            git pull --rebase --autostash origin main || { echo "Rebase failed — aborting push"; git rebase --abort || true; exit 1; }
            git push origin main
          else
            echo "No changes to commit"
          fi
